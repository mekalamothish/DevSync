name: devsync-production
x-app-environment: &app-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  ConnectionStrings__DefaultConnection: ""
  Postgres__Host: postgres
  Postgres__Port: "5432"
  Postgres__Database: ${POSTGRES_DB:-devsync}
  Postgres__Username: ${POSTGRES_USER:-devsync}
  Postgres__Password: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  AllowedHosts: ${PUBLIC_HOST:?Set PUBLIC_HOST}
  Account__PublicBaseUrl: https://${PUBLIC_HOST}
  DataProtection__KeyPath: /app/.local/keys
  ReverseProxy__KnownProxies__0: 172.30.82.10
  Email__Delivery: Smtp
  Email__From: ${EMAIL_FROM:?Set EMAIL_FROM}
  Email__FromName: DevSync
  Email__Smtp__Host: ${EMAIL_SMTP_HOST:-smtp.gmail.com}
  Email__Smtp__Port: ${EMAIL_SMTP_PORT:-587}
  Email__Smtp__Username: ${EMAIL_SMTP_USERNAME:?Set EMAIL_SMTP_USERNAME}
  Email__Smtp__Password: ${EMAIL_SMTP_PASSWORD:?Set EMAIL_SMTP_PASSWORD}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devsync}
      POSTGRES_USER: ${POSTGRES_USER:-devsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  db-init:
    image: devsync-web:${DEVSYNC_IMAGE_TAG:-production}
    build:
      context: ..
      dockerfile: Dockerfile
    environment: *app-environment
    entrypoint: [dotnet, DevSync.Web.dll, --initialize-database]
    volumes:
      - web-data:/app/.local
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true
  web:
    image: devsync-web:${DEVSYNC_IMAGE_TAG:-production}
    environment: *app-environment
    volumes:
      - web-data:/app/.local
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
  proxy:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./nginx.https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certificates:/etc/letsencrypt:ro
      - acme-webroot:/var/www/acme:ro
    networks:
      default:
        ipv4_address: 172.30.82.10
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
  certificate:
    image: certbot/certbot:v5.4.0
    profiles: [maintenance]
    volumes:
      - certificates:/etc/letsencrypt
      - acme-webroot:/var/www/acme
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.82.0/24
volumes:
  postgres-data:
  web-data:
  certificates:
  acme-webroot:
